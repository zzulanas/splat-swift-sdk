name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Swift package + example app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pinned so a runner image update can't silently change the compiler.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Package tests
        run: swift test

      # Unsigned simulator build: proves the example compiles against this
      # revision of the package without any signing identity.
      - name: Example app
        run: >
          xcodebuild build
          -project Examples/SplatCapture/SplatCapture.xcodeproj
          -scheme SplatCapture
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
