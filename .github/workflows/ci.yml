name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Swift package + example app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pinned so a runner image update can't silently change the compiler.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Package tests
        run: swift test

      # Data-race safety is an error in Swift 6 language mode.
      - name: Library in Swift 6 mode
        run: swift build -Xswiftc -swift-version -Xswiftc 6

      # The README's call sites, written from the main actor in Swift 6.
      - name: Swift 6 callers
        run: swift build --package-path Tests/ConcurrencyCheck

      # Unsigned simulator build: proves the example compiles against this
      # revision of the package without any signing identity.
      - name: Example app (Simulator)
        run: >
          xcodebuild build
          -project Examples/SplatCapture/SplatCapture.xcodeproj
          -scheme SplatCapture
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

      # The same, for devices: links SplatKit's iphoneos binaries, which the
      # simulator build never touches.
      - name: Example app (device)
        run: >
          xcodebuild build
          -project Examples/SplatCapture/SplatCapture.xcodeproj
          -scheme SplatCapture
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
