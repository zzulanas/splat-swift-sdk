name: Secrets

on:
  push:
  pull_request:

jobs:
  api-keys:
    name: No committed API keys
    runs-on: ubuntu-latest
    steps:
      # Full history, so the commits a change adds can be read one by one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This repository is public, so a key committed here is leaked, even
      # when a later commit removes it: it stays in the pushed history. Fail
      # on anything shaped like a Splat key (s3d_ + 32 hex) in any tracked
      # file, and in any line a new commit adds. Print where, never the key.
      #
      #   pull request ──> the commits base..head
      #   push ──────────> the commits before..after; for a new or rewritten
      #                    branch, those the default branch doesn't have
      - name: Scan for API keys
        env:
          PATTERN: 's3d_[0-9a-f]{32}'
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: origin/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mask() { sed -E "s/$PATTERN/s3d_<redacted>/g"; }
          leaked=0

          # 1. Every tracked file at this revision.
          status=0
          git grep -nE "$PATTERN" > "$RUNNER_TEMP/tree.txt" || status=$?
          if [ "$status" -eq 0 ]; then
            mask < "$RUNNER_TEMP/tree.txt"
            leaked=1
          elif [ "$status" -ne 1 ]; then
            echo "::error::git grep failed with status $status"
            exit "$status"
          fi

          # 2. Every line the change's commits add. Removed lines don't
          #    count: removing a key is the fix, not a leak.
          if [ -n "$PR_HEAD" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..HEAD"
          else
            range="$DEFAULT_BRANCH..HEAD"
          fi
          if ! commits=$(git log -E -G"$PATTERN" --format=%H "$range"); then
            echo "::error::git log failed for $range"
            exit 2
          fi
          for commit in $commits; do
            git show --format= --no-color -U0 "$commit" \
              | awk '/^\+\+\+ /{file=substr($0,7); next} /^\+/{print file ": " substr($0,2)}' \
              | { grep -E "$PATTERN" || true; } | mask | sed "s|^|$commit |" > "$RUNNER_TEMP/added.txt"
            if [ -s "$RUNNER_TEMP/added.txt" ]; then
              cat "$RUNNER_TEMP/added.txt"
              leaked=1
            fi
          done

          if [ "$leaked" -ne 0 ]; then
            echo "::error::API key committed. Revoke it: it stays in the history even once removed. Then read it from Secrets.xcconfig (see Examples/SplatCapture/README.md)."
            exit 1
          fi
          echo "No API keys in the tree or in the commits of $range."
