name: Secrets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-keys:
    name: No committed API keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository is public, so a key committed here is leaked. Fail on
      # anything shaped like a Splat key (s3d_ + 32 hex) in any tracked file,
      # and print where it is, never the key itself.
      - name: Scan for API keys
        run: |
          status=0
          git grep -nE 's3d_[0-9a-f]{32}' > "$RUNNER_TEMP/keys.txt" || status=$?
          if [ "$status" -eq 0 ]; then
            sed -E 's/s3d_[0-9a-f]{32}/s3d_<redacted>/g' "$RUNNER_TEMP/keys.txt"
            echo "::error::API key committed. Revoke it, then read it from Secrets.xcconfig (see Examples/SplatCapture/README.md)."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::git grep failed with status $status"
            exit "$status"
          fi
          echo "No API keys found."
